[project]
name = "forage"
version = "0.1.0"
description = "Forage — bounded autonomous-business experiment runner"
authors = [{ name = "Forage", email = "forage@local" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "cdp-sdk>=1.48.2",
    "crewai[tools]==1.15.23",
    "eth-account>=0.14.0",
    "fastapi>=0.142.2",
    "httpx>=0.27,<0.29",
    "mcp>=1.20,<2",
    "pyyaml>=6.0.2",
    "typer>=0.12,<0.17",
    "uvicorn>=0.54.0",
    "x402[evm,fastapi,httpx]>=2.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11"]

[project.scripts]
forage = "forage.cli:app"
kickoff = "forage.main:kickoff"
plot = "forage.main:plot"
check-x402-payment-readiness = "forage.gen1.mcp_preflight:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "f03da1d2-7510-45d1-832a-1573448964f0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 160
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
